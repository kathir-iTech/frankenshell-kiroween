name: Check lab
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: npm ci
      - run: npm test
      - run: python scripts/reproduce_benchmarks.py --out evidence --checkout-audit out/checkout-audits
      - run: git diff --exit-code -- evidence/benchmarks.json evidence/test_quantiles_regression.py evidence/test_dedent_regression.py
      - uses: actions/upload-artifact@v4
        with:
          name: cpython-regression-evidence
          path: |
            evidence/benchmarks.json
            evidence/test_quantiles_regression.py
            evidence/test_dedent_regression.py
            out/checkout-audits/quantiles.json
            out/checkout-audits/dedent.json
          if-no-files-found: error
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
